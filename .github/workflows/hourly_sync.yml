name: Hourly 24/7 Multi-API Flight Telemetry Sync

on:
  schedule:
    # Runs automatically every hour on the hour (24/7 in the cloud)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-flight-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Live Multi-API Telemetry Pipeline & Update SQLite
        run: |
          python -c "from backend.main import init_db; init_db(reset=False); print('GitHub Actions 24/7 Cloud Sync Complete!')"

      - name: Commit & Push Updated Flight Database to GitHub
        run: |
          git config --global user.name 'OmniClaim AI Auto-Sync Bot'
          git config --global user.email 'bot@omniclaim-ai.local'
          git add backend/omniclaim.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated 24/7 Hourly Multi-API Flight Database Cloud Update" && git push)
